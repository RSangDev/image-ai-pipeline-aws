AWSTemplateFormatVersion: '2010-09-09'
Description: 'Image AI Processing Pipeline - Rekognition + Lambda + DynamoDB'

Parameters:
  ProjectName:
    Type: String
    Default: image-ai-pipeline
    Description: Project name for resource naming
  
  AlertEmail:
    Type: String
    Default: ''
    Description: Email for content moderation alerts (optional)

Resources:
  # S3 Bucket for Images
  ImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-images-${AWS::AccountId}'
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, POST, DELETE]
            AllowedOrigins: ['*']
            MaxAge: 3000
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt ImageProcessorFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value: .jpg
          - Event: s3:ObjectCreated:*
            Function: !GetAtt ImageProcessorFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value: .png
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # DynamoDB Table for Image Metadata
  MetadataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-metadata'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: image_id
          AttributeType: S
      KeySchema:
        - AttributeName: image_id
          KeyType: HASH
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # SNS Topic for Moderation Alerts
  ModerationAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ProjectName}-moderation-alerts'
      DisplayName: Content Moderation Alerts
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # IAM Role for Image Processor Lambda
  ImageProcessorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ImageProcessorPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:HeadObject
                Resource: !Sub '${ImagesBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - rekognition:DetectLabels
                  - rekognition:DetectFaces
                  - rekognition:DetectText
                  - rekognition:DetectModerationLabels
                  - rekognition:RecognizeCelebrities
                Resource: '*'
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !GetAtt MetadataTable.Arn
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref ModerationAlertTopic

  # Image Processor Lambda Function
  ImageProcessorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-processor'
      Runtime: python3.11
      Handler: handler.lambda_handler
      Role: !GetAtt ImageProcessorRole.Arn
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          METADATA_TABLE: !Ref MetadataTable
          ALERT_TOPIC_ARN: !Ref ModerationAlertTopic
      Code:
        ZipFile: |
          import json
          def lambda_handler(event, context):
              return {'statusCode': 200, 'body': json.dumps('Deploy your code!')}
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # Lambda Permission for S3
  ImageProcessorS3Permission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ImageProcessorFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !GetAtt ImagesBucket.Arn

  # IAM Role for Image Search Lambda
  ImageSearchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ImageSearchPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Scan
                  - dynamodb:Query
                Resource: !GetAtt MetadataTable.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub '${ImagesBucket.Arn}/*'

  # Image Search Lambda Function
  ImageSearchFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-search'
      Runtime: python3.11
      Handler: handler.lambda_handler
      Role: !GetAtt ImageSearchRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          METADATA_TABLE: !Ref MetadataTable
          IMAGES_BUCKET: !Ref ImagesBucket
      Code:
        ZipFile: |
          import json
          def lambda_handler(event, context):
              return {'statusCode': 200, 'body': json.dumps('Deploy your code!')}
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # API Gateway
  SearchApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${ProjectName}-api'
      Description: Image Search API
      EndpointConfiguration:
        Types:
          - REGIONAL

  # API Gateway Resource /search
  SearchResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt SearchApi.RootResourceId
      PathPart: search
      RestApiId: !Ref SearchApi

  # API Gateway Resource /image
  ImageResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt SearchApi.RootResourceId
      PathPart: image
      RestApiId: !Ref SearchApi

  # API Gateway Resource /image/{id}
  ImageIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref ImageResource
      PathPart: '{id}'
      RestApiId: !Ref SearchApi

  # API Gateway Resource /stats
  StatsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt SearchApi.RootResourceId
      PathPart: stats
      RestApiId: !Ref SearchApi

  # GET /search Method
  SearchMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      AuthorizationType: NONE
      HttpMethod: GET
      ResourceId: !Ref SearchResource
      RestApiId: !Ref SearchApi
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ImageSearchFunction.Arn}/invocations'

  # GET /image/{id} Method
  GetImageMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      AuthorizationType: NONE
      HttpMethod: GET
      ResourceId: !Ref ImageIdResource
      RestApiId: !Ref SearchApi
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ImageSearchFunction.Arn}/invocations'

  # GET /stats Method
  StatsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      AuthorizationType: NONE
      HttpMethod: GET
      ResourceId: !Ref StatsResource
      RestApiId: !Ref SearchApi
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ImageSearchFunction.Arn}/invocations'

  # Lambda Permission for API Gateway
  SearchApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ImageSearchFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${SearchApi}/*'

  # API Deployment
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - SearchMethod
      - GetImageMethod
      - StatsMethod
    Properties:
      RestApiId: !Ref SearchApi
      StageName: prod

  # Content Moderation Lambda Role
  ModerationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ModerationPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                Resource: '*'

  # Content Moderation Lambda
  ModerationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-moderation'
      Runtime: python3.11
      Handler: handler.lambda_handler
      Role: !GetAtt ModerationRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          METADATA_TABLE: !Ref MetadataTable
          ALERT_EMAIL: !Ref AlertEmail
      Code:
        ZipFile: |
          import json
          def lambda_handler(event, context):
              return {'statusCode': 200, 'body': json.dumps('Deploy your code!')}
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # SNS Subscription for Moderation Function
  ModerationSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: lambda
      TopicArn: !Ref ModerationAlertTopic
      Endpoint: !GetAtt ModerationFunction.Arn

  # Lambda Permission for SNS
  ModerationSNSPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ModerationFunction
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref ModerationAlertTopic

Outputs:
  ImagesBucketName:
    Description: S3 bucket for image uploads
    Value: !Ref ImagesBucket
    Export:
      Name: !Sub '${ProjectName}-bucket'

  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${SearchApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
    Export:
      Name: !Sub '${ProjectName}-api-endpoint'

  MetadataTableName:
    Description: DynamoDB metadata table
    Value: !Ref MetadataTable
    Export:
      Name: !Sub '${ProjectName}-table'

  ProcessorFunctionName:
    Description: Image processor Lambda function
    Value: !Ref ImageProcessorFunction
    Export:
      Name: !Sub '${ProjectName}-processor'

  SearchFunctionName:
    Description: Image search Lambda function
    Value: !Ref ImageSearchFunction
    Export:
      Name: !Sub '${ProjectName}-search'

  UploadCommand:
    Description: AWS CLI command to upload images
    Value: !Sub 'aws s3 cp your-image.jpg s3://${ImagesBucket}/'